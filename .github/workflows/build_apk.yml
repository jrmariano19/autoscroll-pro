name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter Project & Inject Custom Code
        run: |
          # Cria um projeto limpo do Flutter com toda a estrutura nativa Android pronta
          flutter create app_temp --org com.example --project-name autoscroll --platforms=android
          
          # Copia os teus ficheiros personalizados para dentro do projeto gerado
          if [ -f "lib/main.dart" ]; then cp lib/main.dart app_temp/lib/main.dart; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml app_temp/pubspec.yaml; fi
          
          mkdir -p app_temp/android/app/src/main/kotlin/com/example/autoscroll
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml app_temp/android/app/src/main/AndroidManifest.xml
          fi
          if [ -f "android/app/src/main/kotlin/com/example/autoscroll/MainActivity.kt" ]; then
            cp android/app/src/main/kotlin/com/example/autoscroll/MainActivity.kt app_temp/android/app/src/main/kotlin/com/example/autoscroll/MainActivity.kt
          fi
          if [ -f "android/app/src/main/kotlin/com/example/autoscroll/AutoScrollService.kt" ]; then
            cp android/app/src/main/kotlin/com/example/autoscroll/AutoScrollService.kt app_temp/android/app/src/main/kotlin/com/example/autoscroll/AutoScrollService.kt
          fi

          # Entra na pasta temporária, obtém dependências e compila o APK
          cd app_temp
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app_temp/build/app/outputs/flutter-apk/app-release.apk
